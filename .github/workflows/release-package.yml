name: Build pinned TapTap Alpha ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-alpha:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rebuild the pinned Alpha from source and public inputs
        run: |
          python3 -B scripts/dev.py --package "$RUNNER_TEMP/MonsterDefense-alpha.zip"
          cd "$RUNNER_TEMP"
          sha256sum MonsterDefense-alpha.zip > MonsterDefense-alpha.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TapTap-Alpha-ZIP
          path: |
            ${{ runner.temp }}/MonsterDefense-alpha.zip
            ${{ runner.temp }}/MonsterDefense-alpha.zip.sha256
          if-no-files-found: error
