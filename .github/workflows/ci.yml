name: Public preflight
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tests/chooser-gesture.test.mjs
      - run: python3 scripts/test_public_source.py
      - name: Disclose what was tested
        run: echo "Packaging and isolated UI module fixtures only. No playable build is asserted."
