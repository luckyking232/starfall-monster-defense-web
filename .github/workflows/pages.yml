name: Deploy verified Pages previews
on:
  push:
    branches: [main]
    paths:
      - 'apps/pages/**'
      - 'apps/game/**'
      - 'release/**'
      - 'packages/ui/startup/**'
      - 'packages/ui/display-continuity/**'
      - 'scripts/materialize_public_alpha.py'
      - 'scripts/materialize_startup_qa.py'
      - 'scripts/materialize_display_continuity_qa.py'
      - 'scripts/web_game_manifest.py'
      - 'scripts/package_zip.py'
      - 'scripts/check_zip.py'
      - 'tests/test_packaging.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/web-game-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  web-game:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/web-game-candidate.yml
  build:
    if: github.ref == 'refs/heads/main'
    needs: web-game
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate source paths and artifact tooling
        run: |
          test -z "$(find apps/pages -type l -print -quit)"
          test "$(find apps/pages -type f -printf '%P\n' | LC_ALL=C sort)" = "$(printf '.nojekyll\nindex.html')"
          python3 -m unittest discover -s tests
      - name: Verify and mount published Alpha
        run: |
          curl --proto '=https' --proto-redir '=https' --silent --show-error --fail --location --max-time 90 --max-filesize 21058163 \
            'https://github.com/luckyking232/starfall-monster-defense-web/releases/download/v0.1.0-alpha.1/MonsterDefense-v0.1.0-alpha.1.zip' \
            --output "$RUNNER_TEMP/alpha.zip"
          mkdir -p dist-pages
          cp apps/pages/index.html apps/pages/.nojekyll dist-pages/
          python3 scripts/materialize_public_alpha.py "$RUNNER_TEMP/alpha.zip" release/alpha.1.json dist-pages/play
          python3 scripts/materialize_startup_qa.py "$RUNNER_TEMP/alpha.zip" release/alpha.1.json "$RUNNER_TEMP/qa-startup-base"
          mkdir -p dist-pages/qa
          python3 scripts/materialize_display_continuity_qa.py --startup "$RUNNER_TEMP/qa-startup-base" dist-pages/qa/startup
      - uses: actions/download-artifact@v4
        with:
          name: web-game-dist-${{ github.sha }}
          path: dist-pages/preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
