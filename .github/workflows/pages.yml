name: Deploy verified Alpha preview
on:
  push:
    branches: [main]
    paths: [public-status/**, release/**, scripts/materialize_public_alpha.py, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate source paths and artifact tooling
        run: |
          test -z "$(find public-status -type l -print -quit)"
          test "$(find public-status -type f -printf '%P\n' | LC_ALL=C sort)" = "$(printf '.nojekyll\nindex.html')"
          python3 -m unittest discover -s tests
      - name: Verify and mount published Alpha
        run: |
          curl --proto '=https' --proto-redir '=https' --silent --show-error --fail --location --max-time 90 --max-filesize 21058163 \
            'https://github.com/luckyking232/starfall-monster-defense-web/releases/download/v0.1.0-alpha.1/MonsterDefense-v0.1.0-alpha.1.zip' \
            --output "$RUNNER_TEMP/alpha.zip"
          mkdir -p dist-pages
          cp public-status/index.html public-status/.nojekyll dist-pages/
          python3 scripts/materialize_public_alpha.py "$RUNNER_TEMP/alpha.zip" release/alpha.1.json dist-pages/play
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
