name: Build and publish the game
on:
  push:
    branches: [test, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: public-preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/game
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify tested production candidate
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-promotion.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/game/package-lock.json
      - run: npm ci
      - run: npm run test:inputs
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test game entry, loading, saves and player controls
        env:
          STARFALL_TEST_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --outDir dist --port 4173 --strictPort > /tmp/starfall-preview.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "$STARFALL_TEST_BASE_URL" > /dev/null
          npx playwright test startup-screen product-entry standalone-settings battle-preparation save-transfer viewport-rotation mobile-fullscreen economy-mode endless-records
      - name: Prepare Pages
        if: github.ref == 'refs/heads/test' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p _site/play
          cp index.html _site/
          touch _site/.nojekyll
          rsync -a --exclude='*.map' apps/game/dist/ _site/play/
          node apps/game/scripts/hosted-release.mjs retain _site/play https://luckyking232.github.io/starfall-monster-defense-web/play/
          sed -i 's/name="game-channel" content="production"/name="game-channel" content="test"/' _site/play/index.html
          grep -q 'name="game-channel" content="test"' _site/play/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/test' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/test' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
