<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="game-channel" content="production" />
    <meta name="starfall-asset-inventory" content="asset-inventory.json" />
    <link rel="icon" href="data:," />
    <title>魔物抵御战</title>
  </head>
  <body>
    <div id="app" class="game-frame"></div>
    <section id="startup" aria-labelledby="startup-title" style="position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#151719;color:#f7edda;font-family:system-ui,sans-serif">
      <div style="width:min(80vw,420px)">
        <h1 id="startup-title">魔物抵御战</h1>
        <div class="startup-track"><progress max="100" value="0" aria-label="游戏加载进度"></progress> <span id="startup-percent">0%</span></div>
        <p id="startup-phase" aria-live="polite">正在载入游戏程序</p>
        <small>首次进入需要下载游戏资源，可能需要较长时间。</small>
        <button type="button" id="startup-retry" hidden>重新加载</button>
      </div>
    </section>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
